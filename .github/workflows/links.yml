name: Links

# Links quebrados (04/11/2026, com o lychee: github.com/lycheeverse/lychee, licença MIT/Apache-2.0; ver
# linuarquivos/referencias/github-uteis.md). Duas conferências:
# - "internos", a cada push que mexe nos sites: só os links entre as páginas, sem internet. Falha se algum quebrar.
# - "externos", toda segunda de manhã (e à mão): as fontes e as fotos de fora. Não falha (site de fora cai por umas horas
#   sem culpa nossa): o resultado fica no resumo da execução, na aba Actions.
on:
  push:
    branches: [main]
    paths: ['public/**', 'sitios/**', '.github/workflows/links.yml']
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # cada site com a sua raiz, para os caminhos que começam em "/" acharem o arquivo certo
      - name: Página principal
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --fallback-extensions html --index-files index.html --root-dir ${{ github.workspace }}/public 'public/**/*.html'
      - name: Café Aurora
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --fallback-extensions html --index-files index.html --root-dir ${{ github.workspace }}/sitios/cafe-aurora 'sitios/cafe-aurora/**/*.html'
      - name: Guia do Cerrado
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --fallback-extensions html --index-files index.html --root-dir ${{ github.workspace }}/sitios/fotografia-do-cerrado 'sitios/fotografia-do-cerrado/**/*.html'
      - name: Pica ou Não Pica?
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --no-progress --fallback-extensions html --index-files index.html --root-dir ${{ github.workspace }}/sitios/pica-nao-pica 'sitios/pica-nao-pica/**/*.html'

  externos:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: false
          args: >-
            --no-progress --max-concurrency 8 --max-retries 3 --timeout 30 --accept 200..=299,403,429
            --exclude '^https://(www\.)?(instagram|facebook|linkedin|x|twitter)\.com'
            --exclude '^https://(sites|cafe|cerrado|picanaopica)\.linupedia\.com\.br'
            'public/**/*.html' 'sitios/**/*.html'
