<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{l_titulo}}</title>
<meta name="description" content="{{l_desc}}">
<meta name="theme-color" content="#05030a">
<meta name="robots" content="noindex">
{{alternativas}}
<!-- Página de login do projeto final de Desenvolvimento de Interfaces (18/11/2026). Gerada pelo
     ferramentas/gerar-cafe.mjs do linu-sites, em cada idioma (26/11/2026). O Café é fictício: nada do formulário sai do navegador. -->
<script type="application/json" id="textos-cafe">{{textos_js}}</script>
<script type="application/json" id="textos-entrar">{{entrar_js}}</script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="icon" href="{{raiz}}icone.png" type="image/png" sizes="128x128">
<script src="{{raiz}}inicio.js?v=8"></script>
<link rel="manifest" href="{{raiz}}manifest.webmanifest">
<link rel="stylesheet" href="{{raiz}}estilo.css?v=23">
<link rel="stylesheet" href="{{raiz}}recursos.css?v=2">
<script src="{{raiz}}recursos.js?v=2" defer></script>
<script src="{{raiz}}entrar.js?v=1" defer></script>
</head>

<body class="entrar-pagina">
<a class="skip" href="#conteudo">{{pular}}</a>
<div class="bg-veil" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>

<header class="nav" id="nav">
  <a href="./" class="brand" aria-label="{{l_marca_aria}}" data-aria-dia="{{l_d_marca_aria}}">
    <span class="brand__orb" aria-hidden="true"></span>
    <span class="so-noite">CAFÉ&nbsp;AURORA</span><span class="so-dia">{{d_marca}}</span>
  </a>
  <div class="nav__right">
    <a href="./" class="btn btn--ghost">← <span class="so-noite">{{l_voltar}}</span><span class="so-dia">{{l_d_voltar}}</span></a>
  </div>
</header>

<main id="conteudo" class="entrar">
  <aside class="entrar__lado" aria-labelledby="ladoTitulo">
    <h2 id="ladoTitulo"><span class="so-noite">{{l_lado}}</span><span class="so-dia">{{l_d_lado}}</span></h2>
    <ul>
      <li>{{l_lado1}}</li>
      <li>{{l_lado2}}</li>
      <li>{{l_lado3}}</li>
    </ul>
  </aside>

  <div class="entrar__caixa">
    <div id="entrarArea">
      <h1><span class="so-noite">{{l_h1}}</span><span class="so-dia">{{l_d_h1}}</span></h1>
      <p class="entrar__lead">{{l_lead}}</p>

      <div class="abas" role="tablist" aria-label="{{l_abas}}">
        <button type="button" role="tab" id="abaEntrar" aria-selected="true" aria-controls="painelEntrar">{{l_aba_entrar}}</button>
        <button type="button" role="tab" id="abaCriar" aria-selected="false" aria-controls="painelCriar" tabindex="-1">{{l_aba_criar}}</button>
      </div>

      <section id="painelEntrar" role="tabpanel" aria-labelledby="abaEntrar">
        <form id="formEntrar" novalidate>
          <div class="campo"><label for="eEmail">{{l_email}}</label>
            <input id="eEmail" type="email" name="email" autocomplete="username" inputmode="email" required aria-describedby="eEmailErro">
            <p class="erro" id="eEmailErro" hidden></p></div>
          <div class="campo"><label for="eSenha">{{l_senha}}</label>
            <div class="senha"><input id="eSenha" type="password" name="senha" autocomplete="current-password" required aria-describedby="eSenhaErro">
              <button type="button" aria-pressed="false" aria-controls="eSenha" data-mostrar="{{l_mostrar}}" data-esconder="{{l_esconder}}">{{l_mostrar}}</button></div>
            <p class="erro" id="eSenhaErro" hidden></p></div>
          <label class="lembrar"><input type="checkbox" id="eLembrar" checked> {{l_lembrar}}</label>
          <button type="submit" class="btn btn--magenta">{{l_entrar}}</button>
          <p class="campo__dica">{{l_sem_conta}} <button type="button" class="link-botao" data-ir-aba="abaCriar">{{l_aba_criar}}</button></p>
        </form>
      </section>

      <section id="painelCriar" role="tabpanel" aria-labelledby="abaCriar" hidden>
        <form id="formCadastro" novalidate>
          <div class="campo"><label for="cNome">{{l_nome}}</label>
            <input id="cNome" type="text" name="nome" autocomplete="name" required aria-describedby="cNomeErro">
            <p class="erro" id="cNomeErro" hidden></p></div>
          <div class="campo"><label for="cEmail">{{l_email}}</label>
            <input id="cEmail" type="email" name="email" autocomplete="email" inputmode="email" required aria-describedby="cEmailErro">
            <p class="erro" id="cEmailErro" hidden></p></div>
          <div class="campo"><label for="cSenha">{{l_senha}}</label>
            <div class="senha"><input id="cSenha" type="password" name="senha" autocomplete="new-password" required aria-describedby="cSenhaDica cSenhaErro">
              <button type="button" aria-pressed="false" aria-controls="cSenha" data-mostrar="{{l_mostrar}}" data-esconder="{{l_esconder}}">{{l_mostrar}}</button></div>
            <p class="campo__dica" id="cSenhaDica">{{l_senha_dica}}</p>
            <p class="erro" id="cSenhaErro" hidden></p></div>
          <div class="campo"><label for="cConfirma">{{l_confirma}}</label>
            <input id="cConfirma" type="password" name="confirma" autocomplete="new-password" required aria-describedby="cConfirmaErro">
            <p class="erro" id="cConfirmaErro" hidden></p></div>
          <button type="submit" class="btn btn--magenta">{{l_aba_criar}}</button>
        </form>
      </section>

      <p class="entrar__msg" id="entrarMsg" role="status" aria-live="polite"></p>
    </div>

    <div class="entrar__ok" id="entrarOk" hidden>
      <h2 id="okTitulo" tabindex="-1"></h2>
      <p id="okTexto"></p>
      <div class="entrar__acoes">
        <a href="./#menu" class="btn btn--magenta"><span class="so-noite">{{l_cardapio}}</span><span class="so-dia">{{l_d_cardapio}}</span></a>
        <button type="button" class="btn btn--ghost" id="sair">{{l_sair}}</button>
      </div>
    </div>

    <p class="entrar__aviso">{{l_aviso}}</p>
  </div>
</main>
</body>
</html>
