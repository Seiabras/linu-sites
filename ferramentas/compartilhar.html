<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 400 700; src: url(../public/fontes/space-grotesk-latin.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url(../public/fontes/instrument-sans-latin.woff2) format("woff2"); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background-color: #F3F7FC; color: #0F2547; font-family: "Instrument Sans", sans-serif;
    background-image: linear-gradient(rgba(37, 99, 235, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, .12) 1px, transparent 1px),
      linear-gradient(rgba(37, 99, 235, .065) 1px, transparent 1px), linear-gradient(90deg, rgba(37, 99, 235, .065) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: -1px -1px; }
  .margem { position: absolute; inset: 24px; border: 2px solid #2563EB; }
  .margem::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(37, 99, 235, .38); }
  .texto { position: absolute; left: 72px; top: 72px; width: 500px; }
  .marca { display: flex; align-items: center; gap: 16px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 40px; letter-spacing: -.02em; }
  .marca img { width: 64px; height: 64px; border-radius: 8px; image-rendering: pixelated; }
  .marca b { color: #2563EB; }
  h1 { margin: 44px 0 18px; font-family: "Space Grotesk", sans-serif; font-size: 62px; line-height: 1.04; letter-spacing: -.03em; }
  h1 span { background: linear-gradient(transparent 58%, #FDE047 58% 90%, transparent 90%); }
  p { margin: 0; font-size: 26px; color: #3F5479; }
  .url { position: absolute; left: 72px; bottom: 64px; font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 24px; color: #2563EB; }
  .folha { position: absolute; right: 64px; top: 64px; width: 480px; padding: 14px; background: #FFFFFF; border: 2px solid #2563EB; }
  svg { display: block; width: 100%; height: auto; }
  .t { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .m { fill: none; stroke: #2563EB; stroke-width: 1.6; opacity: .75; stroke-linecap: round; }
  .m .g { stroke-width: 5; } .m .f { stroke-width: 1; opacity: .6; } .m .b { fill: #2563EB; }
  .c { fill: none; stroke: #2563EB; stroke-width: 1.4; }
  .c text { fill: #2563EB; stroke: none; font-family: "Space Grotesk", sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
  .linu { position: absolute; right: 320px; bottom: 44px; width: 240px; height: 388px; image-rendering: pixelated; }
</style>
</head>
