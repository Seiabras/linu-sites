<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Imagem de compartilhamento</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* 1200 × 630: a imagem que aparece quando alguém manda o link (WhatsApp, redes). Gerada por gerar-imagens.mjs. */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #1F2A44; font-family: "Nunito", sans-serif; color: #FFFFFF; display: grid; grid-template-columns: 500px 1fr; align-items: center; gap: 40px; padding: 0 56px; box-sizing: border-box; overflow: hidden; }
  .marca { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; }
  .marca img { width: 72px; height: 72px; border-radius: 20px; }
  .marca b { color: #7DD3FC; font-weight: 900; }
  h1 { margin: 34px 0 0; font-size: 62px; line-height: 1.04; font-weight: 900; letter-spacing: -.02em; }
  h1 span { color: #60A5FA; }
  p { margin: 24px 0 0; font-size: 26px; color: #CBD5E1; font-weight: 700; }
  .url { margin-top: 30px; display: inline-block; padding: 10px 22px; border-radius: 999px; background: #2563EB; font-size: 24px; font-weight: 800; }
  .cena { position: relative; width: 100%; aspect-ratio: 344 / 192; border-radius: 22px; overflow: hidden; outline: 10px solid #FFFFFF; transform: rotate(1.5deg); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .6); }
  .cena img { position: absolute; image-rendering: pixelated; }
  .fundo { inset: 0; width: 100%; height: 100%; }
  .linu { left: calc((150 - 26) / 344 * 100%); top: 63.02%; width: 15.12%; height: 31.77%; }
</style>
</head>
<body>
  <div>
    <div class="marca"><img src="../public/img/linu.svg" alt=""><span>Linu <b>Sites</b></span></div>
    <h1>Sites e apps web <span>sob medida</span></h1>
    <p>Do desenho ao servidor, direto com quem faz.</p>
    <div class="url">sites.linupedia.com.br</div>
  </div>
  <div class="cena">
    <img class="fundo" src="../public/img/abrigo-estacao-dia.png" alt="">
    <img class="linu" src="../public/img/linu/linu-frente.png" alt="">
  </div>
</body>
</html>
