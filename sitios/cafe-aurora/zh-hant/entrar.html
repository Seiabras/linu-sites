 <html> 上的 class（a11y-contraste、a11y-links…）並存在 localStorage；inicio.js 在繪製前套用，所以頁面不會閃爍。","recursos.js · recursos.css (區塊 1 和 5) · inicio.js"],[".a11y-abrir","面板按鈕：由 recursos.js 建立，用 position: fixed 固定在角落。切掉的角是 clip-path；圖示也是用 clip-path 做的六角形。","recursos.js · recursos.css (區塊 5)"],[".nav__idioma","語言捷徑：顯示目前語言的代碼，並直接在清單處打開面板。每種語言的網址來自 <head> 裡的 <link rel=\"alternate\" hreflang>，和搜尋引擎讀的是同一組。","recursos.js · recursos.css (區塊 5)"],[".nav__entrar","登入連結：recursos.js 讀取 localStorage 裡的登入狀態，寫出「登入」或「你好，名字」。","recursos.js · entrar.html · entrar.js"],["#modo","太陽與月亮按鈕：把咖啡館（夜）換成麵包坊（日）。它改變 <html> 的 data-modo 屬性；CSS 重新定義顏色變數（區塊 17），並隱藏 .so-noite 或 .so-dia 的文字。之前，畫面會像霓虹燈一樣閃一下，太陽升起（或月亮落下）。","index.html · estilo.css (區塊 17) · script.js"],["#turno","換班時鐘：inicio.js 每分鐘看一次訪客的時間，說出現在哪間開著（麵包坊 6點到18點，咖啡館 18點到6點），以及離換班還有多久。","index.html · inicio.js"],[".brand","標誌只有文字和 CSS：圓點（.brand__orb）是帶放射狀漸層和光暈（box-shadow）的圓，在動畫（@keyframes pulse）裡脈動。","index.html · estilo.css (區塊 4)"],["#burger","三條線的按鈕（只在手機和平板）：script.js 加上 open 這個 class，用 transform: translateX(0) 把連結抽屜拉進來。aria-expanded 告訴螢幕閱讀器它是否打開。","index.html · estilo.css (區塊 4) · script.js"],[".nav__links","選單連結：霓虹底線是一個寬度從 0 長到 100% 的 ::after。IntersectionObserver 讓正在顯示的區段連結亮起來。","index.html · estilo.css (區塊 4) · script.js"],[".nav","頂端列：固定（position: fixed），在動態背景上有毛玻璃背景（backdrop-filter: blur）。","index.html · estilo.css (區塊 4)"],[".hero__foto","標題後面的店面相片：兩種大小的 WebP（srcset 和 sizes），夜裡和白天各一張，在同一個地方成對拍的。沒顯示的模式的相片不會下載。","index.html · img/ · estilo.css (區塊 6)"],[".hero__rings","入口的光環：三個空的 <i>，每個都是霓虹邊框的圓（border-radius: 50%），在 CSS 動畫裡用不同速度旋轉。離開畫面時會停下，節省處理器。","index.html · estilo.css (區塊 6)"],[".hero__halo","光暈：四色的圓錐漸層（conic-gradient），用 filter: blur(70px) 模糊，在標題後面慢慢旋轉；模糊只算一次，圖層只是旋轉（will-change: transform）。","estilo.css (區塊 6)"],[".magnetic","磁吸按鈕：script.js 跟著指標（pointermove），用 transform 把按鈕拉近幾個像素；指標離開時就回原位。在觸控螢幕和減少動態時，它不會動。","script.js (部分 7) · estilo.css"],[".btn","霓虹按鈕：強調色（--c）的細邊框、字距拉開的 Orbitron 大寫字，滑過時有 box-shadow 光暈。","estilo.css (區塊 4)"],[".hero__stats","頂端的數字：flex 清單，數字用 Orbitron，下面是比較小的說明。","index.html · estilo.css (區塊 6)"],[".hero","開場區段：標題用 Orbitron（網站自己提供的字型），以多層 text-shadow 發光。有 .reveal 的元素會用 IntersectionObserver 在捲動時出現。","index.html · estilo.css (區塊 6) · script.js"],[".marquee","跑馬燈：文字連續放了兩次，動畫把帶子移到 translateX(-50%)，所以結尾會無縫接上開頭。","index.html · estilo.css (區塊 7)"],[".busca","菜單搜尋：role=\"search\" 裡的 <input type=\"search\">。recursos.js 把你輸入的字和名稱、說明比對（不分重音，normalize('NFD')），再用 aria-live 報出結果。","recursos.js · recursos.css (區塊 2)"],["#menuFiltros","篩選：帶 aria-pressed 的按鈕。script.js 隱藏（hidden）不符合的卡片，並數剩下幾張。","index.html · script.js · estilo.css (區塊 18)"],[".card__info","品項詳情：一個帶 <summary> 的 <details>，不用 JavaScript 就能打開和關上，也能用鍵盤操作。","index.html · estilo.css (區塊 18)"],[".card__add","「+ 訂單」：script.js 把品項放進訂單（存在 localStorage），並更新訂購按鈕上的數字。","index.html · script.js"],[".card","菜單卡片：一個 <article>，有相片（WebP，接近時才下載，loading=\"lazy\"）、標籤、價格和訂購按鈕。在手機上卡片橫向滑動（scroll-snap），平板是 2 欄，電腦是 3 欄（CSS Grid）。","index.html · estilo.css (區塊 9)"],[".cup-stage","杯子只用 CSS 畫：杯身是底部有 border-radius 的 <div>，把手是帶邊框的偽元素，液體（#liquid）由 script.js 改變高度和顏色，蒸氣是會動的條紋。加料會開啟 com-1 到 com-4 的 class。","index.html · estilo.css (區塊 10) · script.js (部分 8)"],["#pao, .tabua","麵包也只有 CSS：用八個數值的 border-radius 做出圓形，加上兩個漸層。烘烤時間讓外皮變深（變數 --casca 和 --miolo），麵包也長高一點（高度），全都由 script.js 寫入；配料會開啟 com-1 到 com-4 的 class。","index.html · estilo.css (區塊 17) · script.js"],["#labForm","組合器：幾組按鈕和一個滑桿（<input type=\"range\">）。每次改變，script.js 就組出名稱、顏色、價格和圖。","index.html · script.js (部分 8) · estilo.css (區塊 10)"],["#laboratorio","實驗室：CSS Grid 的兩欄（手機上上下排列），一邊是組合器，一邊是圖。","index.html · estilo.css (區塊 10)"],[".galeria","相片集：網站原本就有的相片，夜裡是咖啡館的，白天是麵包坊的，每張都有替代文字和說明（<figure> 和 <figcaption>），放在輪播裡。","recursos.js (部分 3) · recursos.css (區塊 3)"],[".carrossel","手做的輪播：軌道是帶 overflow-x 和 scroll-snap 的帶子；箭頭和圓點會捲到那張投影片（scrollTo）。每 7 秒自己換一張，滑鼠停在上面、焦點在裡面或開了「停止動畫」時就會停下。","recursos.js (部分 3) · recursos.css (區塊 3)"],[".trans","一則心得：帶 <q> 的 <blockquote>（引號由瀏覽器加上），以及寫說話者的 <footer>。","index.html · estilo.css (區塊 11)"],["#sobre","起源：文字和入口用 CSS Grid 並排；入口是放射狀漸層的圓，周圍有旋轉的光環。","index.html · estilo.css (區塊 8)"],[".fidelidade","集點卡：每列五個、共十個虛線圓；每送出一筆訂單就蓋一個章（洋紅色放射狀漸層），在 localStorage 裡計數。","index.html · script.js · estilo.css (區塊 18)"],["#reservaForm","訂位：script.js 一邊輸入一邊檢查的 <form novalidate>（名字、人數、日期，以及營業時間內的時刻）。錯誤出現在欄位旁，並用 aria-describedby 連到欄位。","index.html · script.js · estilo.css (區塊 18)"],["#reservas","訂位一覽：一邊是表單，另一邊是集點卡和已訂的位子，都存在瀏覽器裡。","index.html · script.js · estilo.css (區塊 18)"],["#newsForm","電子報：script.js 檢查電子郵件，並用 role=\"status\" 的訊息回應。它不會寄到任何地方：咖啡館是虛構的。","index.html · script.js · estilo.css (區塊 13)"],[".versoes-troca","版本切換：五個版本（純 CSS、Bootstrap、Tailwind、Bulma 和 Pico）裡都有同樣的連結，目前的版本用 aria-current 標示。","index.html · versoes.html"],[".foot","頁尾：CSS Grid 的三欄，中型螢幕變兩欄，手機變一欄。","index.html · estilo.css (區塊 13)"],["#dim","調頻器：一個 <input type=\"range\">。夜裡它改變 <html> 的變數 --desvio，四個強調色 hsl(calc(色相 + var(--desvio)) …) 會一起旋轉。白天它變成「調整光線」：inicio.js 用 6點到18點的太陽時刻寫入 --luz-* 變數，稍微改變色調、背景和相片。","index.html · estilo.css (區塊 0, 14 和 17) · inicio.js · script.js"],["#pedido","訂單：一個 <dialog>，有數量、總計和表單。「用 WhatsApp 傳送」會打開寫好的訊息（wa.me），不帶號碼，因為咖啡館是虛構的。","index.html · script.js · estilo.css (區塊 18)"],["#quiz","測驗：<dialog> 裡的三個問題；script.js 把答案加總，選出最合適的菜單品項。","index.html · script.js"],[".cta","結尾的呼籲：大標題和兩個磁吸按鈕。","index.html · estilo.css (區塊 12)"],["main","頁面內容。它後面的背景是 script.js 以每秒 30 格（手機 20 格）繪製的 <canvas>（#bg），夜裡是透視格線和粒子，白天是飄落的麵粉；上面有幾層 CSS（薄紗、雜訊和電視掃描線），設了 pointer-events: none，不會攔下點擊。","index.html · script.js · estilo.css (區塊 1)"],["body","頁面：背景是 var(--bg)，文字用 Rajdhani，還有自訂游標（兩個跟著指標走的 <div>，用 mix-blend-mode: screen）。最後面是動態背景的 <canvas>。","index.html · estilo.css (區塊 0, 1 和 3) · script.js"]]},"luz":{"titulo":"調整光線","rotulo":"日光","aria":"麵包坊的光線時刻","aria_dim":"日光調整","momentos":[[7.5,"黎明"],[11,"早上"],[13.5,"中午"],[16.5,"下午"],[99,"傍晚"]],"agora":"現在","zero":"原點"},"fmt_hora":"{hh}:{mm}","fmt_hora_cheia":"{h}點","fmt_dur":"{h}小時{m}分","fmt_ap":["",""],"expresso":"量子濃縮咖啡","coldbrew":"神經冷萃","matcha":"虛空抹茶","estelar":"星光牛奶","nivel":"等級","editar":"✎ 編輯文字","d_nome":"極光麵包坊","lab_add":"加入訂單"}</script>

<main id="conteudo" class="entrar">
  <aside class="entrar__lado" aria-labelledby="ladoTitulo">
    <h2 id="ladoTitulo"><span class="so-noite">你的帳號讓裂縫保持開著。</span><span class="so-dia">你的帳號讓麵包保持溫熱。</span></h2>
    <ul>
      <li>你組好的訂單，輕點一下就能再點一次。</li>
      <li>你的訂位，附日期和時間。</li>
      <li>集點卡：每10筆訂單，就有一筆由店家招待。</li>
    </ul>
  </aside>

  <div class="entrar__caixa">
    <div id="entrarArea">
      <h1><span class="so-noite">登入 Café Aurora</span><span class="so-dia">登入極光麵包坊</span></h1>
      <p class="entrar__lead">使用你的電子郵件和密碼，或在一分鐘內建立帳號。</p>

      <div class="abas" role="tablist" aria-label="登入或建立帳號">
        <button type="button" role="tab" id="abaEntrar" aria-selected="true" aria-controls="painelEntrar">登入</button>
        <button type="button" role="tab" id="abaCriar" aria-selected="false" aria-controls="painelCriar" tabindex="-1">建立帳號</button>
      </div>

      <section id="painelEntrar" role="tabpanel" aria-labelledby="abaEntrar">
        <form id="formEntrar" novalidate>
          <div class="campo"><label for="eEmail">電子郵件</label>
            <input id="eEmail" type="email" name="email" autocomplete="username" inputmode="email" required aria-describedby="eEmailErro">
            <p class="erro" id="eEmailErro" hidden></p></div>
          <div class="campo"><label for="eSenha">密碼</label>
            <div class="senha"><input id="eSenha" type="password" name="senha" autocomplete="current-password" required aria-describedby="eSenhaErro">
              <button type="button" aria-pressed="false" aria-controls="eSenha" data-mostrar="顯示" data-esconder="隱藏">顯示</button></div>
            <p class="erro" id="eSenhaErro" hidden></p></div>
          <label class="lembrar"><input type="checkbox" id="eLembrar" checked> 在這台裝置上保持登入</label>
          <button type="submit" class="btn btn--magenta">登入</button>
          <p class="campo__dica">還沒有帳號？ <button type="button" class="link-botao" data-ir-aba="abaCriar">建立帳號</button></p>
        </form>
      </section>

      <section id="painelCriar" role="tabpanel" aria-labelledby="abaCriar" hidden>
        <form id="formCadastro" novalidate>
          <div class="campo"><label for="cNome">名字</label>
            <input id="cNome" type="text" name="nome" autocomplete="name" required aria-describedby="cNomeErro">
            <p class="erro" id="cNomeErro" hidden></p></div>
          <div class="campo"><label for="cEmail">電子郵件</label>
            <input id="cEmail" type="email" name="email" autocomplete="email" inputmode="email" required aria-describedby="cEmailErro">
            <p class="erro" id="cEmailErro" hidden></p></div>
          <div class="campo"><label for="cSenha">密碼</label>
            <div class="senha"><input id="cSenha" type="password" name="senha" autocomplete="new-password" required aria-describedby="cSenhaDica cSenhaErro">
              <button type="button" aria-pressed="false" aria-controls="cSenha" data-mostrar="顯示" data-esconder="隱藏">顯示</button></div>
            <p class="campo__dica" id="cSenhaDica">至少8個字元，包含字母和數字。</p>
            <p class="erro" id="cSenhaErro" hidden></p></div>
          <div class="campo"><label for="cConfirma">再輸入一次密碼</label>
            <input id="cConfirma" type="password" name="confirma" autocomplete="new-password" required aria-describedby="cConfirmaErro">
            <p class="erro" id="cConfirmaErro" hidden></p></div>
          <button type="submit" class="btn btn--magenta">建立帳號</button>
        </form>
      </section>

      <p class="entrar__msg" id="entrarMsg" role="status" aria-live="polite"></p>
    </div>

    <div class="entrar__ok" id="entrarOk" hidden>
      <h2 id="okTitulo" tabindex="-1"></h2>
      <p id="okTexto"></p>
      <div class="entrar__acoes">
        <a href="./#menu" class="btn btn--magenta"><span class="so-noite">看菜單</span><span class="so-dia">看出爐的麵包</span></a>
        <button type="button" class="btn btn--ghost" id="sair">登出</button>
      </div>
    </div>

    <p class="entrar__aviso">學習用網站：Café Aurora 並不存在。帳號只留在這個瀏覽器裡，不會透過網路傳送任何東西；密碼只保存摘要（SHA-256）。</p>
  </div>
</main>
